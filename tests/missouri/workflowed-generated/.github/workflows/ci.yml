name: 'ci'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  ci:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'test'
        run: |
          cargo test
      - name: 'audit'
        run: |
          sh -c 'cargo audit || true'
