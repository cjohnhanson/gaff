doc: |
  Codex and agy register through `gaff init --host`, and each hook call
  names its host on the command line. agy sends no event name, so its
  registration passes `--event`. Codex gets Claude Code's context JSON
  and no flush at `Stop`. agy gets injected steps, reads its first model
  call as a prompt, and a gaff fault on agy exits 0, because agy refuses
  a tool call on any non-zero code. The payloads are the shapes real
  sessions sent.
transitions:
  - name: "codex and agy register, flush, and refuse in their own shapes"
    command: |
      export HOME="$PWD/home"
      mkdir -p "$HOME/.config/gaff"
      cat > "$HOME/.config/gaff/gaff.yml" <<'EOF'
      sections:
        - name: conventions
          file: conv.md
      reminders:
        - name: cadence
          every:
            tool_calls: 1
          text: CADENCE TEXT
      guards:
        - name: no-rm
          tool: Bash
          matches: 'rm\s+-rf'
          message: Not that.
      EOF
      printf 'HOUSE RULES\n' > "$HOME/.config/gaff/conv.md"

      # Registration: each host's file, each host's shape.
      gaff init --host codex > /dev/null || { echo "FAIL: init codex"; exit 1; }
      gaff init --host agy > /dev/null || { echo "FAIL: init agy"; exit 1; }
      [ "$(jq -r '.hooks.PreToolUse[0].hooks[0].command' .codex/hooks.json)" = "gaff hook --host codex" ] || { echo "FAIL: codex entry"; exit 1; }
      [ "$(jq -r '.gaff.PreInvocation[0].command' .agents/hooks.json)" = "gaff hook --host agy --event PreInvocation" ] || { echo "FAIL: agy entry"; exit 1; }
      [ "$(jq -r '.gaff.PreToolUse[0].matcher' .agents/hooks.json)" = "*" ] || { echo "FAIL: agy matcher"; exit 1; }
      gaff doctor 2>/dev/null | grep -q 'hooks (agy): registered' || { echo "FAIL: doctor must read the agy file"; exit 1; }

      # Codex: Claude Code's context JSON at session start.
      OUT=$(printf '{"session_id":"s-c1","cwd":"%s","hook_event_name":"SessionStart","model":"m","source":"startup"}' "$PWD" | gaff hook --host codex)
      [ "$(printf '%s' "$OUT" | jq -r '.hookSpecificOutput.hookEventName')" = "SessionStart" ] || { echo "FAIL: codex shape: $OUT"; exit 1; }
      # A tool call arms the reminder. Codex cannot carry context at
      # Stop, so the stop prints nothing and the reminder waits.
      printf '{"session_id":"s-c1","turn_id":"t","hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"ls"},"tool_use_id":"u1"}' | gaff hook --host codex > /dev/null
      OUT=$(printf '{"session_id":"s-c1","turn_id":"t","hook_event_name":"Stop","stop_hook_active":false}' | gaff hook --host codex)
      [ -z "$OUT" ] || { echo "FAIL: codex must print nothing at Stop: $OUT"; exit 1; }
      OUT=$(printf '{"session_id":"s-c1","turn_id":"t2","hook_event_name":"UserPromptSubmit","prompt":"p"}' | gaff hook --host codex)
      case "$OUT" in *"CADENCE TEXT"*) ;; *) echo "FAIL: the reminder must wait for the prompt: $OUT"; exit 1 ;; esac
      # A Codex guard refuses with exit 2.
      printf '{"session_id":"s-c1","turn_id":"t2","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"rm -rf x"},"tool_use_id":"u2"}' | gaff hook --host codex > /dev/null 2>&1
      [ "$?" = "2" ] || { echo "FAIL: the codex guard must refuse"; exit 1; }

      # agy: no event name in the payload; --event supplies it.
      OUT=$(printf '{"conversationId":"s-a1","workspacePaths":["%s"]}' "$PWD" | gaff hook --host agy --event SessionStart)
      case "$(printf '%s' "$OUT" | jq -r '.injectSteps[0].systemMessage.systemMessage')" in
        *"HOUSE RULES"*) ;;
        *) echo "FAIL: agy session start: $OUT"; exit 1 ;;
      esac
      printf '{"conversationId":"s-a1","stepIdx":2,"error":"","toolCall":{"name":"run_command","args":{"CommandLine":"ls"}},"workspacePaths":["%s"]}' "$PWD" | gaff hook --host agy --event PostToolUse > /dev/null
      OUT=$(printf '{"conversationId":"s-a1","invocationNum":1,"initialNumSteps":4,"workspacePaths":["%s"]}' "$PWD" | gaff hook --host agy --event PreInvocation)
      case "$OUT" in *"CADENCE TEXT"*) ;; *) echo "FAIL: agy tool batch flush: $OUT"; exit 1 ;; esac
      printf '{"conversationId":"s-a1","stepIdx":3,"toolCall":{"name":"run_command","args":{"CommandLine":"rm -rf x"}},"workspacePaths":["%s"]}' "$PWD" | gaff hook --host agy --event PreToolUse > /dev/null 2>&1
      [ "$?" = "2" ] || { echo "FAIL: the agy guard must refuse"; exit 1; }
      # A gaff fault on agy never refuses a tool call.
      printf 'not json' | gaff hook --host agy --event PreToolUse > /dev/null 2>&1
      [ "$?" = "0" ] || { echo "FAIL: an agy fault must exit 0"; exit 1; }

      # Uninstall leaves nothing of gaff's behind.
      gaff init --host codex --uninstall > /dev/null
      gaff init --host agy --uninstall > /dev/null
      [ "$(jq -c . .codex/hooks.json)" = "{}" ] || { echo "FAIL: codex uninstall"; exit 1; }
      [ "$(jq -c . .agents/hooks.json)" = "{}" ] || { echo "FAIL: agy uninstall"; exit 1; }

      rm -rf home .gaff-state .codex .agents
      echo HOSTED_OK
    target: ../hosted-registered
    stdout: "HOSTED_OK\n"
