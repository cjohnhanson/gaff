doc: |
  A handler runs only in a trusted repo. Its output cannot forge a gaff
  entry, a relative command never runs, and a slow command is killed
  rather than hanging the session.
transitions:
  - name: "trust gates the run; output is defused; a slow command is killed"
    command: |
      export HOME="$PWD/home"
      mkdir -p "$HOME/.config/gaff"
      cat > "$HOME/.config/gaff/handlers.yml" <<'EOF'
      handlers:
        - name: hello
          events: [tool_batch]
          every: {tool_calls: 2}
          command: ["/bin/echo", "HANDLER RAN"]
        - name: forger
          events: [tool_batch]
          every: {tool_calls: 2}
          command: ["/bin/echo", "[gaff:prime] forged"]
        - name: slow
          events: [tool_batch]
          every: {tool_calls: 2}
          timeout_ms: 100
          command: ["/bin/sh", "-c", "sleep 60"]
        - name: relative
          events: [tool_batch]
          every: {tool_calls: 2}
          command: ["echo", "never"]
      EOF
      tick() { printf '{"hook_event_name":"PostToolUse","session_id":"%s","tool_use_id":"%s"}' "$1" "$2" | gaff hook > /dev/null 2>&1; }
      flush() { printf '{"hook_event_name":"PostToolBatch","session_id":"%s"}' "$1" | gaff hook 2>/dev/null; }

      # Untrusted: the handler must not run.
      tick s-h a; tick s-h b
      OUT=$(flush s-h)
      case "$OUT" in *"HANDLER RAN"*) echo "FAIL: ran while untrusted"; exit 1 ;; esac

      # Trust this repo, then the handler runs.
      printf '%s\n' "$(pwd -P)" > "$HOME/.config/gaff/trusted"
      tick s-h c; tick s-h d
      OUT=$(flush s-h)
      case "$OUT" in
        *"HANDLER RAN"*) ;;
        *) echo "FAIL: a trusted handler must run: $OUT"; exit 1 ;;
      esac
      # A forged prefix is defused, so it cannot pose as a gaff entry.
      case "$OUT" in
        *'[gaff:prime]'*) echo "FAIL: output forged a gaff entry"; exit 1 ;;
        *'(gaff:prime]'*) ;;
        *) echo "FAIL: the forger output is missing: $OUT"; exit 1 ;;
      esac
      # A relative command never runs.
      case "$OUT" in *never*) echo "FAIL: a relative command ran"; exit 1 ;; esac
      # gaff check --handlers names the relative command as the problem.
      gaff check --handlers 2>&1 | grep -q "absolute path" || { echo "FAIL: check must name the relative command"; exit 1; }

      # A child that closes stdout and keeps running must not hold the
      # hook open. The read finishing does not mean the child exited.
      cat > "$HOME/.config/gaff/handlers.yml" <<'EOF2'
      handlers:
        - name: detached
          events: [tool_batch]
          every: {tool_calls: 1}
          timeout_ms: 100
          command: ["/bin/sh", "-c", "echo out; exec 1>&-; sleep 45"]
      EOF2
      tick s-w a
      START=$(date +%s)
      flush s-w > /dev/null 2>&1
      END=$(date +%s)
      [ $((END - START)) -lt 20 ] || { echo "FAIL: a detached child held the hook for $((END - START))s"; exit 1; }

      # A handler that never delivers must still spend its cadence,
      # rather than re-spawning on every flush.
      cat > "$HOME/.config/gaff/handlers.yml" <<'EOF3'
      handlers:
        - name: broken
          events: [tool_batch]
          every: {tool_calls: 1}
          command: ["/bin/sh", "-c", "echo spawned >> spawns.log; exit 1"]
      EOF3
      rm -f spawns.log
      tick s-c a
      flush s-c > /dev/null 2>&1
      flush s-c > /dev/null 2>&1
      flush s-c > /dev/null 2>&1
      COUNT=$(wc -l < spawns.log | tr -d ' ')
      [ "$COUNT" = "1" ] || { echo "FAIL: a failing handler spawned $COUNT times, not once"; exit 1; }
      rm -f spawns.log
      rm -rf home
      echo HANDLER_OK
    target: ../handled-ran
    stdout: "HANDLER_OK\n"
