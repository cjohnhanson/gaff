doc: |
  The repo declares the reviews a change must pass. A merge gate reads
  the list from gaff, never by parsing the config file. An absent
  declaration and an empty one differ: nobody stated a policy, against
  an author who stated that none is required.

  HOME is hermetic. The layers union, so a real user config would add
  its own names and the assertions below would drift with the machine.
env:
  HOME: "."
transitions:
  - name: "reviews prints the declared list, one to a line, in order"
    command: |
      OUT=$(gaff reviews)
      code=$?
      [ "$code" = 0 ] || { echo "FAIL: exit $code"; exit 1; }
      [ "$(printf '%s' "$OUT" | tr '\n' ',')" = "review-tests,review-docs" ] || { echo "FAIL: got [$OUT]"; exit 1; }
      echo LISTED_OK
    target: ../reviews-listed
    stdout: "LISTED_OK\n"
