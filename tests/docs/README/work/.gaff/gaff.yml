sections:
  - name: conventions
    file: sections/conventions.md
    refresh: {tool_calls: 25}

reminders:
  - name: scratch
    every: {tool_calls: 20}
    text: "Update your working notes before they go stale."

profiles:
  focus:
    disable: [scratch]
transitions:
  agent_may_set: [focus]

git:
  - name: fmt
    on: [pre-commit]
    command: ["cargo", "fmt", "--check"]

github:
  - name: ci
    on: [pull_request]
    steps:
      - use_git: fmt
