[package]
name = "gaff"
version = "0.1.2"
edition = "2024"
# 1.88, read from the graph rather than from the edition. Edition 2024
# needs 1.85, and that floor is too low here: a locked dependency asks
# for 1.88 itself. A floor that is too low is worse than none, because a
# consumer takes it and meets an error from inside the crate anyway.
rust-version = "1.88"
description = "A context-lifecycle handler for coding agents: counters, cadenced re-injection, prime sections, and profiles"
license = "MIT"
authors = ["Cody Hanson"]
repository = "https://github.com/cjohnhanson/gaff"
homepage = "https://github.com/cjohnhanson/gaff"
keywords = ["agent", "context", "llm", "prompt", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    # The npm wrapper and its generator are release machinery. The
    # generated platform packages each hold a built binary, and one of
    # those reached a crate before this line existed.
    "npm/",
    # These drive npm/ and .github/, both dropped, so they cannot run
    # from the tarball.
    "tests/npm_wrapper_platforms.rs",
    "tests/npm_generate.rs",
    "tests/release_workflow.rs",
    "tests/review_gate_workflow.rs",
    "tests/common/",
    # These run scripts/, dropped below.
    "tests/merge_gate_guard.rs",
    "tests/prepublish_gate.rs",
    # This reads .agents/, dropped below. Packaged without this line,
    # the crate's own suite panicked on a missing file rather than on
    # the prose disagreement it exists to catch.
    "tests/trust_vocabulary.rs",
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"


# Two names, one build. `gaff` is what a person types. `gaffr` exists
# because the registries that matter for `uvx` and `npx` needed a free
# name, and maturin ties the command to the Cargo bin name.
[[bin]]
name = "gaff"
path = "src/main.rs"

[[bin]]
name = "gaffr"
path = "src/bin/gaffr.rs"

[dependencies]
fs2 = "0.4.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the key order of a settings file gaff edits.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
# Finds the git dir from a working directory, including a worktree's
# `.git` file. Pure filesystem; it spawns nothing.
gix-discover = "0.54"
gix-hash = { version = "0.26", default-features = false, features = ["sha1"] }
# Reads the review note and peels a pushed tag, out of the object
# database. The single-binary rule bans a git process, and note reading
# needs object decoding, packfile lookup, and the notes fanout, which
# no file read covers. gaff turns on no network feature itself, and
# every read it makes is local. diataxis's `store` feature takes gix
# with its network client through mdstore-core, and cargo unifies
# features, so the lock carries reqwest and rustls; nothing here
# reaches them, and the linker drops them.
# 0.87, not 0.86. gix 0.86 pulls gix-protocol 0.64, which requires
# bisync, and every published bisync version is yanked, so a consumer
# cannot resolve this crate. gix-protocol 0.65 dropped it.
gix = { version = "0.87", default-features = false, features = ["revision", "sha1"] }

# The documentation set. gaff parses its own arguments, so it takes
# the store half and none of the clap surface.
diataxis = { version = "0.1", default-features = false, features = ["store"] }

# For the open flags on a section body: O_NONBLOCK so a FIFO cannot
# wedge the hook, and O_NOFOLLOW so the final component cannot be
# swapped for a link after the path was confined.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# A safe wrapper for kill(2) on a process group. `unsafe` is forbidden
# here, and spawning /bin/kill is not single-binary.
nix = { version = "0.31", default-features = false, features = ["signal"] }

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[build-dependencies]
diataxis = { version = "0.1", default-features = false, features = ["build"] }

# `cargo deb` reads this. It produces target/debian/*.deb, which the
# release attaches to the GitHub release. Installing that file is
# `dpkg -i`, and it is not an apt repository: `apt-get install gaff`
# needs a hosted, signed repository that does not exist yet.
[package.metadata.deb]
maintainer = "cjohnhanson <cody@codyjhanson.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "A context-lifecycle handler for coding agents"
assets = [
    ["target/release/gaff", "usr/bin/", "755"],
    # The short name ships too, so the rule holds on apt: install under
    # one name and both commands work.
    ["target/release/gaffr", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/gaff/README", "644"],
    ["LICENSE", "usr/share/doc/gaff/LICENSE", "644"],
]
