[package]
name = "gaff"
version = "0.1.0"
edition = "2024"
description = "A context-lifecycle handler for coding agents: counters, cadenced re-injection, prime sections, and profiles"
license = "MIT"
repository = "https://github.com/cjohnhanson/gaff"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
fs2 = "0.4.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

# For the open flags on a section body: O_NONBLOCK so a FIFO cannot
# wedge the hook, and O_NOFOLLOW so the final component cannot be
# swapped for a link after the path was confined.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
