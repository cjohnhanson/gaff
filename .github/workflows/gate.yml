# Generated by gaff from the gaff config. Do not edit.
# Change the config, then run `gaff init --github`.
# `gaff check --github` reports a file that drifted.
name: 'gate'

on:
  pull_request:

jobs:
  gate:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'fetch review notes'
        run: |
          sh -c 'git fetch origin +refs/notes/reviews:refs/notes/reviews || true'
      - name: 'rust toolchain'
        uses: 'dtolnay/rust-toolchain@stable'
        with:
          'components': 'clippy, rustfmt'
      - name: 'rust cache'
        uses: 'Swatinem/rust-cache@v2'
      - name: 'install missouri'
        uses: 'cjohnhanson/missouri@main'
      - name: 'install pandoc'
        run: |
          sh -c 'curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb && echo '\''4db8bad3d9f8451a3d52171664f3c58b08af6450fbd54a28dd05f6b00b0bbb04  /tmp/pandoc.deb'\'' | sha256sum -c - && sudo dpkg -i /tmp/pandoc.deb'
      - name: 'install gaff from tree'
        run: |
          sh -c 'cargo install --path . --locked --root "$HOME/.gaff-tools" gaff && echo "$HOME/.gaff-tools/bin" >> "$GITHUB_PATH"'
      - name: 'gaff ci'
        run: |
          gaff ci
