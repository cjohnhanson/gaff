name: 'nix'

on:
  pull_request:

jobs:
  nix:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'install nix'
        uses: 'cachix/install-nix-action@v31'
      - name: 'build the flake package'
        run: |
          nix build '.#default' -L --no-link
