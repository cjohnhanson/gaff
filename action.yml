name: 'gaff'
description: 'Install gaff and run the gates the repo declares'
inputs:
  ref:
    description: 'The gaff ref to install: a branch, a tag, or a sha'
    required: false
    default: 'main'
  run:
    description: 'Run `gaff ci` after the install (true or false)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: 'rust components'
      shell: bash
      run: rustup component add clippy rustfmt
    - name: 'resolve gaff ref'
      id: resolve
      shell: bash
      run: |
        ref='${{ inputs.ref }}'
        sha=$(git ls-remote https://github.com/cjohnhanson/gaff "refs/heads/$ref" | cut -f1)
        [ -n "$sha" ] || sha=$(git ls-remote https://github.com/cjohnhanson/gaff "refs/tags/$ref" | cut -f1)
        [ -n "$sha" ] || sha="$ref"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: 'cache gaff'
      uses: actions/cache@v4
      with:
        path: ~/.gaff-tools
        key: gaff-bin-${{ runner.os }}-${{ steps.resolve.outputs.sha }}
    - name: 'install gaff'
      shell: bash
      run: |
        if [ ! -x "$HOME/.gaff-tools/bin/gaff" ]; then
          cargo install --git https://github.com/cjohnhanson/gaff \
            --rev "${{ steps.resolve.outputs.sha }}" --locked \
            --root "$HOME/.gaff-tools" gaff
        fi
    - name: 'gaff on PATH'
      shell: bash
      run: echo "$HOME/.gaff-tools/bin" >> "$GITHUB_PATH"
    - name: 'gaff ci'
      if: ${{ inputs.run == 'true' }}
      shell: bash
      run: gaff ci
