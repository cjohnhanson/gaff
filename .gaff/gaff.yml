# The reviews a change must pass before it merges. `gaff reviews`
# prints them and `gaff reviews check` holds them, so no gate
# hard-codes a name.
#
# An absent key means this repo declared no policy, and the check
# refuses the push. An unknown policy is not an empty one. Write
# `reviews: []` to require none.
# Each name is a skill vendored into .agents/skills by almanac, and
# each is read by one independent agent that sees the change and
# nothing else. signoff-driver states the procedure and when to stop.
reviews:
  - review-tests
  - review-docs
  - review-code
  - review-deps
  - review-usability

# Repo-level gaff config. Two entries. The commit gate holds formatted
# code and a clean clippy on pre-commit. The merge gate holds tests,
# the missouri suite, and a sign-off for every declared review on
# pre-push, which
# is the merge check in a repo that merges by direct push. Installed by
# `gaff init --git`.
git:
  - name: commit-gate
    on:
      - pre-commit
    command:
      - sh
      - scripts/commit-gate.sh
  - name: merge-gate
    on:
      - pre-push
    command:
      - sh
      - scripts/merge-gate.sh

# The CI gate runs the same declarations under `gaff ci`.
# Branch protection on main requires this check.
#
# The pull_request trigger is required. A fork's pull request raises no
# push event here, so without it the check never reports and no pull
# request can merge.
github:
  - name: gate
    # A pull request only. A squash merge writes a commit no reviewer
    # saw, so a run on main asked for a note that cannot exist and
    # failed after every merge. `gaff ci` reads the branch head from
    # the event payload, which is the commit a reviewer read.
    on:
      - pull_request
    steps:
      - name: fetch review notes
        command: [sh, -c, "git fetch origin +refs/notes/reviews:refs/notes/reviews || true"]
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust cache
        uses: Swatinem/rust-cache@v2
      - name: install missouri
        uses: cjohnhanson/missouri@main
      - name: install gaff from tree
        command: [sh, -c, "cargo install --path . --locked --root \"$HOME/.gaff-tools\" gaff && echo \"$HOME/.gaff-tools/bin\" >> \"$GITHUB_PATH\""]
      - name: gaff ci
        command: [gaff, ci]

  # A push still runs the tests and the linters, so a merge that breaks
  # main is visible. The review check is absent on purpose: it belongs
  # on the pull request head, where the note names the commit under
  # review.
  - name: verify
    on:
      - push
    steps:
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust cache
        uses: Swatinem/rust-cache@v2
      - name: install missouri
        uses: cjohnhanson/missouri@main
      - name: install gaff from tree
        command: [sh, -c, "cargo install --path . --locked --root \"$HOME/.gaff-tools\" gaff && echo \"$HOME/.gaff-tools/bin\" >> \"$GITHUB_PATH\""]
      - name: formatting
        command: [cargo, fmt, --all, --check]
      - name: clippy
        command: [cargo, clippy, --workspace, --all-targets, --all-features, --, -D, warnings]
      - name: tests
        command: [cargo, test, --workspace, --all-features]
      # MISSOURI_SANDBOX=preinstalled, because a runner has no nix and
      # the action installs the packages the suites declare. Without it
      # missouri refuses: "nix sandbox configured but `nix` binary not
      # found on PATH". merge-gate.sh sets the same variable when CI is
      # set.
      - name: missouri suite
        command: [sh, -c, "[ -d tests/missouri ] || exit 0; cd tests/missouri && MISSOURI_SANDBOX=preinstalled missouri run"]
